seed: 'base'
random_seed: 42

# JetClass data and outputs
signal: 'TTBar_'
background: 'ZJetsToNuNu'
n_signal: 1000
n_background: 1000
n_signal_val: 200
n_background_val: 200
n_signal_test: 2000
n_background_test: 2000
flat: false
norm_pt: false
data_dir: './data/JetClass'
save_dir: './saved_models'
dump: './results'

# Circuit
wires: 4
num_layers: 1
shots: 2500
backend: 'autograd'
device_name: 'lightning.qubit'
circuit_type: 'normal'
operations_per_qubit: 3
aux_weights:
  scale_factor: 1.0
  bias: 0.1

# Optimization
batch_size: 100
epochs: 25
lr: 0.05
improv: 0.01
min_epochs: 10
decay_rate: 0.5
decay_patience: 3
loss: 'MSE'

# Run control
save: true
resume: false
desc: 'Training run'
